name: Build Taskee APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - run: gh release create taskee-apk --title "Taskee APK" --notes "Built from source via CI" build/app/outputs/flutter-apk/app-release.apk
        env:
          GH_TOKEN: ${{ github.token }}
